<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Смета в PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: слева загрузка и настройки, справа лист A4 как он попадёт в PDF */
:root{
  --bg:#F1F0F5; --panel:#FFFFFF; --ink:#15162B; --muted:#6B6C8A; --line:#E0E0EC;
  --accent:#FD8F00; --accent-ink:#151629; --ok:#0E8F5F; --err:#C8283C; --chip:#E9E8F2;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F1B; --panel:#191A2C; --ink:#ECECF6; --muted:#9A9BB8; --line:#2B2C45; --chip:#25263D; --ok:#3CCB93; --err:#FF7083; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F1B; --panel:#191A2C; --ink:#ECECF6; --muted:#9A9BB8; --line:#2B2C45; --chip:#25263D; --ok:#3CCB93; --err:#FF7083; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:16px}
.app{max-width:1200px;margin:0 auto;padding-block:20px 32px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);padding-top:0}
@media(max-width:860px){.side{position:static}}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
.lead{color:var(--muted);margin:4px 0 0;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);outline:none}
.drop b{display:block;font-size:15px}
.drop span{color:var(--muted);font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-weight:500}
input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sw{display:flex;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--ink)}
.sw button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;font-size:13.5px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.btn2{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg);color:var(--ink);cursor:pointer}
.btn2:hover{border-color:var(--accent)}.btn2:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lrow{display:flex;gap:8px;flex-wrap:wrap}
.logo-prev{height:36px;max-width:100%;object-fit:contain;background:#15162B;border-radius:6px;padding:5px 9px;align-self:flex-start}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:progress}
.status{font-size:12.5px;min-height:18px;color:var(--muted)}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.demo{font-size:12.5px;background:var(--chip);border-radius:8px;padding:8px 11px;color:var(--muted)}
.preview{min-width:0}
.stage{position:relative;width:100%;max-width:794px;overflow:hidden;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 36px rgba(20,20,50,.14)}

/* ===== Лист документа (всегда светлый, как бумага) ===== */
.paper{width:794px;min-height:1123px;background:#fff;color:#151629;font-family:'Inter',system-ui,sans-serif;font-size:13.3px;line-height:1.4;font-variant-numeric:tabular-nums;transform-origin:top left;position:relative;padding-bottom:70px}
.paper *{box-sizing:border-box}
.p-top{background:#151629;color:#fff;padding:24px 57px 20px;border-bottom:3px solid #FD8F00}
.p-r1{display:flex;justify-content:space-between;align-items:center;min-height:35px}
.p-lbox.pl{background:#fff;padding:8px 8px;border-radius:7px}
.p-logo{display:block;width:227px;height:auto;max-height:45px;object-fit:contain}
.p-rt{text-align:right;font-size:12px;color:#B4B6C2}
.p-rt b{display:block;color:#fff;font-weight:600;font-size:14px}
.p-h1{font-size:28px;font-weight:700;line-height:1.1;white-space:nowrap;margin:20px 0 0;letter-spacing:0}
.p-sub{font-size:12.7px;margin-top:6px}
.p-dir,.p-meta{font-size:12px;color:#B4B6C2;margin-top:4px}
.p-main{padding:34px 57px 0}
.p-sec{margin-bottom:30px}
.p-sec h2{font-size:18px;font-weight:700;margin:0 0 6px;padding-left:11px;border-left:4px solid #FD8F00;line-height:1.1}
.p-sec table{width:100%;border-collapse:collapse;table-layout:fixed}
.p-sec th{white-space:nowrap;font-size:12px;font-weight:600;color:#626779;text-align:left;padding:8px 9px 7px;border-bottom:1px solid #151629}
.p-sec td{padding:11px 9px;border-bottom:1px solid #E2E4EB;vertical-align:top;overflow-wrap:anywhere}
.p-sec .c{text-align:center;padding-inline:3px}.p-sec .n{text-align:right;white-space:nowrap}
.p-sec .b{font-weight:600}
.p-sec tr.sum td{background:#F4F5F8;border:0;font-weight:600;padding:9px}
.p-tot{background:#151629;color:#fff;border-radius:13px;padding:21px;margin-bottom:23px}
.p-tot .r{display:flex;justify-content:space-between;align-items:baseline;color:#B4B6C2;font-size:13.3px;margin-bottom:8px}
.p-tot .f{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #3B3D55;margin-top:12px;padding-top:14px;color:#fff}
.p-tot .f span{font-weight:600;font-size:14.7px}.p-tot .f b{font-weight:700;font-size:34.7px;line-height:1;white-space:nowrap}
.p-note{background:#F4F5F8;border-left:4px solid #FD8F00;padding:14px 21px 14px;margin-bottom:15px;font-size:12.7px;line-height:1.4;white-space:pre-line}
.p-note b{display:block;font-weight:600;font-size:13.3px;margin-bottom:3px}
.p-valid{font-size:12px}
.p-foot{position:absolute;left:57px;right:57px;bottom:24px;border-top:1px solid #E2E4EB;padding-top:10px;display:flex;justify-content:space-between;font-size:11.3px;color:#626779}
.offscreen{position:fixed;left:-12000px;top:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="app">
  <aside class="side">
    <div>
      <h1>Смета в PDF</h1>
      <p class="lead">Загрузите Excel со сметой и скачайте оформленный PDF формата A4.</p>
    </div>
    <div class="panel">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Выбрать файл Excel">
        <b>Выберите .xlsx файл</b>
        <span>или перетащите сюда. Формулы и числа берутся из файла.</span>
      </div>
      <input id="file" type="file" accept=".xlsx,.xlsm,.xls" hidden>
      <div class="demo" id="demo">Сейчас показан пример. После загрузки здесь будет ваша смета.</div>
      <div class="status" id="status" role="status"></div>
    </div>
    <div class="panel">
      <label class="f" for="co">Название компании в шапке
        <input type="text" id="co" placeholder="Например, ТОО «Звук и Свет»" autocomplete="off">
      </label>
      <div class="f" style="gap:8px">Логотип
        <div class="lrow"><button class="btn2" id="lbtn" type="button">Загрузить логотип</button><button class="btn2" id="lrm" type="button" hidden>Убрать</button></div>
        <img class="logo-prev" id="lprev" alt="Загруженный логотип" hidden>
        <input id="lfile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
      </div>
      <label class="chk" for="myl"><input type="checkbox" id="myl"> Логотип RentalHub</label>
      <label class="chk" for="pl" id="plw" hidden><input type="checkbox" id="pl"> Белая подложка под логотипом</label>
      <label class="chk" for="dt"><input type="checkbox" id="dt" checked> Показывать дату</label>
    </div>
    <button class="btn" id="go">Скачать PDF</button>
  </aside>
  <section class="preview"><div class="stage" id="stage"><div class="paper" id="paper"></div></div></section>
</div>
<div class="offscreen" id="off"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var CUR={KZT:'₸',USD:'$',EUR:'€',RUB:'₽',UAH:'₴',GBP:'£',CNY:'¥'};
var state={logo:null,plaque:false,model:null,company:'',date:true,fname:'Смета',demo:true};

function today(){var d=new Date();return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()}
function normDirs(a){
  var o=[],i=0;
  while(i<a.length){
    var t=a[i],n=a[i+1]||'';
    if(/^led$/i.test(t)&&/^экран(ы|ов)?$/i.test(n)){o.push('LED-экраны');i+=2;continue}
    if(/^сценическ/i.test(t)&&/^конструкц/i.test(n)){o.push(t+' '+n.toLowerCase());i+=2;continue}
    o.push(/^led$/i.test(t)?'LED':t);i++}
  return o}
/* Пример: те же позиции, что в присланной смете */
var SAMPLE={sub:'Аренда концертного оборудования',date:today(),meta:[],chips:normDirs(['Звук','Свет','Led','Экраны','Сценические','Конструкции','Эффекты']),cur:'₸',
 blocks:[
  {t:'sec',title:'Экраны и видео',rows:[
    {parts:['SONNOC','Профессиональный лазерный проектор 10000 люмен'],nums:[10,300000,3000000]},
    {parts:['Novastar','Fiber optic cable'],nums:[2,20000,40000]},
    {parts:['Datapath','HDMI разветвитель'],nums:[3,20000,60000]},
    {parts:['Медиасервер','Resolume Arena'],nums:[1,80000,80000]}],sum:3180000},
  {t:'sec',title:'Персонал, транспорт, услуги',rows:[{parts:['Логистика оборудования'],nums:[2,60000,120000]}],sum:120000},
  {t:'tot',rows:[{label:'Стоимость позиций',v:3300000},{label:'Итого с учётом скидки',v:2990000}]},
  {t:'note',text:'За каждый последующий день аренды, репетиций, простоя оборудования Заказчик уплачивает дополнительно 50% к общей стоимости аренды.'},
  {t:'foot',text:'Данное ценовое предложение действительно в течение трёх календарных дней со дня даты составления предложения.'}]};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n).replace(/ | /g,' ')}

/* ---------- чтение Excel ---------- */
function parseWorkbook(wb){
  var ws=wb.Sheets[wb.SheetNames[0]];
  if(!ws||!ws['!ref'])throw new Error('Лист пустой.');
  var rng=XLSX.utils.decode_range(ws['!ref']);
  var memo={};
  function val(addr,depth){
    if(memo.hasOwnProperty(addr))return memo[addr];
    var c=ws[addr];if(!c)return null;
    var v=c.v;
    if((v===undefined||v===null)&&c.f&&(depth||0)<30){v=evalF(c.f,(depth||0)+1)}
    memo[addr]=v;return v;
  }
  function evalF(f,d){
    try{
      var e=f.replace(/\$/g,'').toUpperCase();
      e=e.replace(/SUM\(([A-Z]+\d+):([A-Z]+\d+)\)/g,function(_,a,b){
        var r=XLSX.utils.decode_range(a+':'+b),s=0;
        for(var R=r.s.r;R<=r.e.r;R++)for(var C=r.s.c;C<=r.e.c;C++){var x=val(XLSX.utils.encode_cell({r:R,c:C}),d);if(typeof x==='number')s+=x}
        return '('+s+')'});
      e=e.replace(/[A-Z]+\d+/g,function(a){var x=val(a,d);return '('+(typeof x==='number'?x:0)+')'});
      if(!/^[0-9+\-*\/().\s]+$/.test(e))return null;
      var r=Function('"use strict";return ('+e+')')();
      return isFinite(r)?r:null;
    }catch(x){return null}
  }
  var cur='',rows=[];
  for(var R=rng.s.r;R<=rng.e.r;R++){
    var texts=[],nums=[];
    for(var C=rng.s.c;C<=rng.e.c;C++){
      var a=XLSX.utils.encode_cell({r:R,c:C}),c=ws[a];if(!c)continue;
      var v=val(a);
      if(v===null||v===undefined||v==='')continue;
      if(typeof v==='number'){
        nums.push(v);
        var m=/\[\$([A-Za-z]{3})/.exec(c.z||'');if(m&&CUR[m[1].toUpperCase()])cur=CUR[m[1].toUpperCase()];
      }else{var s=String(v).replace(/\r/g,'').trim();if(s)texts.push(s)}
    }
    if(texts.length||nums.length)rows.push({texts:texts,nums:nums});
  }
  if(!rows.length)throw new Error('В файле нет данных.');
  var m={title:'',sub:'',date:today(),meta:[],chips:null,cur:cur||'',blocks:[]},sec=null,tot=null,i=0,MK=/^(заказчик|мероприятие|площадка|место проведения|место|период аренды|период|дата мероприятия)\s*[:：]?\s*(.*)$/i;
  for(i=0;i<rows.length;i++){
    var r=rows[i],label=r.texts.join(' ');
    if(!m.title){m.title=r.texts[0]||'Смета';m.sub=m.title;continue}
    if(!m.blocks.length&&!r.nums.length){var mk=MK.exec(r.texts[0]);if(mk){var v=(mk[2]||r.texts[1]||'').trim();if(v){m.meta.push({label:mk[1].charAt(0).toUpperCase()+mk[1].slice(1).toLowerCase(),value:v});continue}}}
    if(!r.nums.length&&r.texts.length===1){
      var t=r.texts[0];
      if(!m.chips&&!m.blocks.length&&/\s{2,}|\s*[•·|]\s*/.test(t)){m.chips=normDirs(t.split(/\s*[•·|]\s*|\s{2,}/).map(function(s){return s.trim()}).filter(Boolean));continue}
      if(t.length>70||t.indexOf('\n')>-1){sec=null;m.blocks.push({t:'note',text:t});continue}
      sec={t:'sec',title:t,rows:[],sum:null};m.blocks.push(sec);tot=null;continue;
    }
    if(r.nums.length){
      var last=r.nums[r.nums.length-1];
      if(/итог/i.test(label)){
        if(!tot){tot={t:'tot',rows:[]};m.blocks.push(tot)}
        tot.rows.push({label:label.replace(/[:：]\s*$/,''),v:last});sec=null;continue}
      if(/^\s*(сумма|всего|total)/i.test(label)&&sec){sec.sum=last;continue}
      if(!sec){sec={t:'sec',title:'',rows:[],sum:null};m.blocks.push(sec)}
      sec.rows.push({parts:r.texts,nums:r.nums});continue;
    }
    if(r.texts.length>1){/* строка из нескольких текстов без чисел: считаем заголовком колонок и пропускаем */}
  }
  /* последний длинный абзац после примечания — нижняя строка */
  var notes=m.blocks.filter(function(b){return b.t==='note'});
  if(notes.length>1)notes[notes.length-1].t='foot';
  if(!m.chips)m.chips=[];
  if(!m.blocks.some(function(b){return b.t==='sec'&&b.rows.length}))throw new Error('Не нашёл позиции с ценами. Проверьте, что в файле есть строки с числами.');
  return m;
}

/* ---------- вёрстка листа ---------- */
function renderPaper(m,o){
  var cur=m.cur||'₸',k=1;
  m.blocks.forEach(function(b){if(b.t==='sec')b.rows.forEach(function(r){k=Math.max(k,r.nums.length)})});k=Math.min(3,k);
  var H=k>=3?['Кол-во','Цена, '+cur,'Сумма, '+cur]:k===2?['Цена, '+cur,'Сумма, '+cur]:['Сумма, '+cur];
  var h='<div class="p-top"><div class="p-r1">';

  h+='<div class="p-rt">'+(o.company?'<b>'+esc(o.company)+'</b>':'')+((o.date&&m.date)?'Дата составления: '+esc(m.date):'')+'</div></div>';
  h+='<h1 class="p-h1">Смета на аренду оборудования</h1>';

  if(m.chips&&m.chips.length)h+='<div class="p-dir">'+m.chips.map(esc).join(' \u00b7 ')+'</div>';
  if(m.meta&&m.meta.length)h+='<div class="p-meta">'+m.meta.map(function(x){return esc(x.label)+': '+esc(x.value)}).join(' \u00b7 ')+'</div>';
  h+='</div><div class="p-main">';
  m.blocks.forEach(function(b){
    if(b.t==='sec'){
      var hb=b.rows.some(function(r){return r.parts.length>1});
      var fr=k>=3?[17,40,9,16,18]:k===2?[17,49,16,18]:[17,65,18];
      if(!hb){fr=[fr[0]+fr[1]].concat(fr.slice(2))}
      h+='<div class="p-sec"><h2>'+esc(b.title)+'</h2><table><colgroup>'+fr.map(function(w){return '<col style="width:'+w+'%">'}).join('')+'</colgroup><thead><tr>'+(hb?'<th>Бренд</th>':'')+'<th>Позиция</th>'+H.map(function(x,i){return '<th class="'+(k>=3&&i===0?'c':'n')+'">'+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>';
      b.rows.forEach(function(r){
        var c='';
        if(hb)c+=r.parts.length>1?'<td class="b">'+esc(r.parts[0])+'</td><td>'+esc(r.parts.slice(1).join(' '))+'</td>':'<td></td><td>'+esc(r.parts[0]||'')+'</td>';
        else c+='<td>'+esc(r.parts.join(' '))+'</td>';
        var ns=r.nums.slice(-k);while(ns.length<k)ns.unshift(null);
        c+=ns.map(function(v,i){var last=i===k-1;return '<td class="'+(k>=3&&i===0?'c':'n')+(last?' b':'')+'">'+(v===null?'':(k>=3&&i===0?esc(String(v)):fmt(v)))+'</td>'}).join('');
        h+='<tr>'+c+'</tr>';
      });
      if(b.sum!==null&&b.sum!==undefined)h+='<tr class="sum"><td colspan="'+(1+(hb?1:0)+(k-1))+'">Итого по разделу</td><td class="n">'+fmt(b.sum)+'</td></tr>';
      h+='</tbody></table></div>';
    }else if(b.t==='tot'){
      var rs=b.rows,fin=rs[rs.length-1].v,cost=rs.length>1?rs[0].v:null,disc=cost!==null?cost-fin:0,cs='\u00a0'+cur;
      h+='<div class="p-tot">';
      if(cost!==null)h+='<div class="r"><span>Стоимость позиций</span><span>'+fmt(cost)+cs+'</span></div>';
      if(cost!==null&&disc>0.004)h+='<div class="r"><span>Скидка</span><span>\u2212'+fmt(disc)+cs+'</span></div>';
      h+='<div class="f"><span>'+(cost!==null?'Итого с учётом скидки':'Итого')+'</span><b>'+fmt(fin)+cs+'</b></div></div>';
    }else if(b.t==='note'){
      var ls=b.text.split('\n');if(/^внимание!?$/i.test(ls[0].trim()))ls.shift();
      h+='<div class="p-note"><b>Условия аренды</b>'+esc(ls.join('\n'))+'</div>';
    }else if(b.t==='foot'){h+='<div class="p-valid">'+esc(b.text)+'</div>'}
  });
  h+='</div><div class="p-foot"><span>Смета на аренду оборудования'+((o.date&&m.date)?' \u00b7 '+esc(m.date):'')+'</span><span>Стр. 1 из 1</span></div>';
  return '<div class="paper">'+h+'</div>';
}

/* ---------- показ ---------- */
var stage=$('stage');
function paint(){
  var o={company:state.company.trim(),accent:state.accent,date:state.date,logo:state.logo,plaque:state.plaque};
  stage.innerHTML=renderPaper(state.model,o);
  fit();
}

  var w=stage.clientWidth,s=Math.min(1,w/794);

function setStatus(t,c){var s=$('status');s.textContent=t;s.className='status'+(c?' '+c:'')}

function loadFile(f){
  if(!f)return;
  setStatus('Читаю файл…');
  var rd=new FileReader();

/* логотип */
function deflate(u8){
  if(!window.CompressionStream)return Promise.resolve(null);
  try{var cs=new CompressionStream('deflate'),w=cs.writable.getWriter();w.write(u8);w.close();
    return new Response(cs.readable).arrayBuffer().then(function(b){return new Uint8Array(b)},function(){return null})}catch(e){return Promise.resolve(null)}
}
function trimLogo(img){
  var iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  if(!iw||!ih)throw new Error('size');
  var sc=Math.min(1,700/iw),w=Math.max(1,Math.round(iw*sc)),h=Math.max(1,Math.round(ih*sc));
  var c=document.createElement('canvas');c.width=w;c.height=h;
  var x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  var d=x.getImageData(0,0,w,h).data,x0=w,y0=h,x1=-1,y1=-1;
  for(var y=0;y<h;y++)for(var i=0;i<w;i++){if(d[(y*w+i)*4+3]>0){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)throw new Error('empty');
  var cw=x1-x0+1,ch=y1-y0+1,c2=document.createElement('canvas');c2.width=cw;c2.height=ch;
  c2.getContext('2d').drawImage(c,x0,y0,cw,ch,0,0,cw,ch);return c2;
}
function logoFromCanvas(c){
  var w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data,n=w*h,rgb=new Uint8Array(n*3),al=new Uint8Array(n),sem=false;
  for(var i=0;i<n;i++){rgb[i*3]=d[i*4];rgb[i*3+1]=d[i*4+1];rgb[i*3+2]=d[i*4+2];al[i]=d[i*4+3];if(d[i*4+3]<250)sem=true}
  return Promise.all([deflate(rgb),sem?deflate(al):Promise.resolve(null)]).then(function(r){
    var fl=!!r[0];
    return {w:w,h:h,rgb:r[0]||rgb,alpha:sem?(r[1]||al):null,flate:fl&&(!sem||!!r[1])};
  });
}
function applyLogo(c,save){
  return logoFromCanvas(c).then(function(p){
    var url=c.toDataURL('image/png');
    state.logo={url:url,pdf:p,my:false};
    $('lprev').src=url;$('lprev').hidden=false;$('lrm').hidden=false;$('plw').hidden=false;$('lbtn').textContent='Заменить логотип';
    if(save){try{localStorage.setItem('pdfsmeta.logo',url);localStorage.setItem('pdfsmeta.my',save==='my'?'1':'0')}catch(e){}}
    syncMy();paint();
  });
}

  state.logo=null;$('lprev').hidden=true;$('lrm').hidden=true;$('plw').hidden=true;$('lbtn').textContent='Загрузить логотип';

function loadLogoUrl(url,save){

  img.onload=function(){try{applyLogo(trimLogo(img),save).catch(function(){setStatus('Не удалось обработать логотип.','err')})}catch(e){setStatus('Не удалось прочитать логотип. Загрузите PNG или JPG.','err')}};
  img.onerror=function(){setStatus('Не удалось открыть логотип. Загрузите PNG или JPG.','err')};
  img.src=url;
}

$('lfile').addEventListener('change',function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  var u=URL.createObjectURL(f);

function syncMy(){$('myl').checked=!!state.logo&&state.logo.my===true}
$('myl').addEventListener('change',function(e){
  if(e.target.checked){var img=new Image();img.onload=function(){applyLogo(trimLogo(img),'my').then(function(){state.logo.my=true;syncMy()})};img.src=MYLOGO}
  else clearLogo();
});
/* экспорт */
var downloads=null,btn=$('go');
function useDl(){
  if(!window.claude||!window.claude.use)return;
  window.claude.use('downloads').then(function(d){downloads=d}).catch(function(){});
}
useDl();
btn.addEventListener('click',function(){
  btn.disabled=true;btn.textContent='Готовлю PDF…';setStatus('');
  var bytes;
  try{bytes=buildPdf(state.model,{company:state.company.trim(),accent:state.accent,date:state.date,logo:state.logo&&state.logo.pdf,plaque:state.plaque},FONTS)}
  catch(e){setStatus('Не получилось собрать PDF. Проверьте файл и попробуйте ещё раз.','err');btn.disabled=false;btn.textContent='Скачать PDF';return}
  Promise.resolve().then(function(){
    var blob=new Blob([bytes],{type:'application/pdf'});
    if(downloads)return downloads.save({filename:state.fname+'.pdf',data:blob});
    var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=state.fname+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
  }).then(function(){setStatus('PDF сохранён.','ok')})
  .catch(function(e){
    var c=e&&e.code;
    setStatus(c==='declined'?'Сохранение отменено.':c==='unavailable'||c==='not_granted'?'Здесь нельзя сохранять файлы. Откройте страницу в приложении Claude.':'Не получилось сохранить PDF. Попробуйте ещё раз.','err');
  }).then(function(){btn.disabled=false;btn.textContent='Скачать PDF'});
});

state.model=SAMPLE;
paint();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
