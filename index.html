<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Смета в PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: слева загрузка и настройки, справа лист A4 как он попадёт в PDF */
:root{
  --bg:#F1F0F5; --panel:#FFFFFF; --ink:#15162B; --muted:#6B6C8A; --line:#E0E0EC;
  --accent:#E8175D; --accent-ink:#FFFFFF; --ok:#0E8F5F; --err:#C8283C; --chip:#E9E8F2;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F1B; --panel:#191A2C; --ink:#ECECF6; --muted:#9A9BB8; --line:#2B2C45; --chip:#25263D; --ok:#3CCB93; --err:#FF7083; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F1B; --panel:#191A2C; --ink:#ECECF6; --muted:#9A9BB8; --line:#2B2C45; --chip:#25263D; --ok:#3CCB93; --err:#FF7083; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:16px}
.app{max-width:1200px;margin:0 auto;padding-block:20px 32px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);padding-top:0}
@media(max-width:860px){.side{position:static}}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
.lead{color:var(--muted);margin:4px 0 0;font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);outline:none}
.drop b{display:block;font-size:15px}
.drop span{color:var(--muted);font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-weight:500}
input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sw{display:flex;gap:8px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--ink)}
.sw button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;font-size:13.5px}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.btn2{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg);color:var(--ink);cursor:pointer}
.btn2:hover{border-color:var(--accent)}.btn2:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lrow{display:flex;gap:8px;flex-wrap:wrap}
.logo-prev{height:36px;max-width:100%;object-fit:contain;background:#15162B;border-radius:6px;padding:5px 9px;align-self:flex-start}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:10px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:hover{filter:brightness(1.06)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.55;cursor:progress}
.status{font-size:12.5px;min-height:18px;color:var(--muted)}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.demo{font-size:12.5px;background:var(--chip);border-radius:8px;padding:8px 11px;color:var(--muted)}
.preview{min-width:0}
.stage{position:relative;width:100%;overflow:hidden;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 36px rgba(20,20,50,.14)}

/* ===== Лист документа (всегда светлый, как бумага) ===== */
.paper{--p-ink:#15162B;--p-acc:#E8175D;--p-mut:#6B6C8A;--p-line:#E3E4EF;--p-soft:#F2F2F8;
  width:794px;min-height:1123px;background:#fff;color:var(--p-ink);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.4;
  transform-origin:top left;position:relative;padding-bottom:36px}
.paper *{box-sizing:border-box}
.p-top{background:var(--p-ink);color:#fff;padding:52px 48px 34px;position:relative;overflow:hidden}
.p-top:before{content:"";position:absolute;right:-110px;top:-150px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--p-acc) 0,transparent 68%);opacity:.72}
.p-top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--p-acc)}
.p-co{position:relative;font-weight:600;font-size:13px;color:#C9CAE6;margin-bottom:14px}
.p-title{position:relative;font-size:35px;font-weight:800;line-height:1.1;letter-spacing:-.02em;white-space:nowrap;margin:0}
.p-chips{position:relative;display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;font-size:12px;color:#C9CAE6}
.p-chips span{display:flex;align-items:center;gap:18px}
.p-chips span+span:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--p-acc);margin-left:-18px;margin-right:13px}
.p-chips span:first-child:before{display:none}
.p-date{position:relative;margin-top:16px;font-size:12px;color:#9FA0C4}
.p-main{padding:34px 48px 0}
.p-sec{margin-bottom:30px;break-inside:avoid}
.p-sec h2{font-size:18px;font-weight:700;margin:0 0 10px;padding-left:12px;border-left:5px solid var(--p-acc);line-height:1.2}
.p-sec table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.p-sec th{font-size:11px;font-weight:600;color:var(--p-mut);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--p-ink)}
.p-sec td{padding:11px 8px;border-bottom:1px solid var(--p-line);vertical-align:top}
.p-sec .n{text-align:right;white-space:nowrap}
.p-sec .b{font-weight:700}.p-sec .br{font-weight:600}
.p-sec tr.sum td{background:var(--p-soft);border:0;font-weight:700;padding:10px 8px}
.p-sec tr.sum td.l{color:var(--p-mut);font-weight:500}
.p-tot{background:var(--p-ink);color:#fff;border-radius:12px;padding:24px 28px;margin-top:6px;break-inside:avoid}
.p-tot .r{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.p-tot .r.mut{color:#B9BAD8;font-size:13px;padding-bottom:13px;margin-bottom:14px;border-bottom:1px solid #3A3B5E}
.p-tot .r.mut b{font-weight:500;text-decoration:line-through;white-space:nowrap}
.p-tot .r.main span{font-weight:600;font-size:14px}
.p-tot .r.main b{font-size:34px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.p-tot .r.main b i{font-style:normal;font-size:18px;color:var(--p-acc);margin-left:5px;filter:brightness(1.35)}
.p-tot .r.only b{font-size:34px}
.p-note{margin-top:26px;border-left:5px solid #FF8A3D;background:#FFF5EC;padding:14px 18px;font-size:12.5px;line-height:1.55;white-space:pre-line;break-inside:avoid}
.p-foot{margin:26px 48px 0;padding-top:12px;border-top:1px solid var(--p-line);font-size:11.5px;color:var(--p-mut)}
.p-lrow{position:relative;display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.p-lbox.pl{background:#fff;padding:9px 13px;border-radius:9px}
.p-logo{display:block;height:51px;width:auto;max-width:280px;object-fit:contain}
.p-co2{font-weight:600;font-size:14px;color:#C9CAE6}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;font:inherit;font-weight:600;font-size:13px;border:0;border-radius:7px;padding:8px 6px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--muted);margin-top:-4px}
.p-top.kp{padding:37px 56px 30px}.p-top.kp .p-title{font-size:33px}.p-top.kp .p-lrow{margin-bottom:24px}
.k-rt{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:#9FA0C4;position:relative}.k-rt b{color:#fff;font-weight:600;font-size:14px}
.k-info{background:#F2F2F8;border-left:5px solid var(--p-acc);padding:12px 20px;font-size:13.3px;margin-bottom:20px}
.k-info div+div{margin-top:4px}
.k-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.k-tbl th{font-size:10.7px;font-weight:600;color:var(--p-mut);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--p-ink);white-space:nowrap}
.k-tbl td{padding:10px 8px;border-bottom:1px solid var(--p-line);vertical-align:top;font-size:13.3px}
.k-tbl td.k-ph{padding:10px 4px 10px 0}.k-ph img{width:77px;height:61px;object-fit:contain;display:block}
.k-nm{font-weight:600}.k-ds{color:var(--p-mut);font-size:12px;margin-top:3px;line-height:1.35}
.k-tbl .k-c{text-align:center}.k-tbl .k-n{text-align:right;white-space:nowrap}.k-tbl .k-b{font-weight:700}
.k-pill{display:inline-block;font-size:11.3px;font-weight:600;background:#F2F2F8;border-radius:10px;padding:1px 9px;white-space:nowrap}.k-pill.used{background:#FFF1E0;color:#9A4B00}
.k-sec td{font-weight:700;font-size:17px;padding-top:22px;border-left:5px solid var(--p-acc)}
.k-total{display:flex;justify-content:space-between;align-items:center;gap:20px;background:var(--p-ink);color:#fff;border-radius:11px;padding:12px 21px 12px 19px;margin:13px 0 27px}.k-total span{font-weight:600;font-size:14px;color:#C9CAE6}.k-total b{font-size:21px;font-weight:700;white-space:nowrap}
.k-notes{background:#F2F2F8;border-left:5px solid var(--p-acc);padding:17px 20px;font-size:12.7px;line-height:1.42}
.k-notes b{display:block;font-size:14px;margin-bottom:8px}
.k-notes ul{margin:0;padding-left:17px}.k-notes li{margin-bottom:8px}.k-notes li::marker{color:var(--p-acc)}
.k-tot{flex:1;background:var(--p-ink);color:#fff;border-radius:13px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-height:140px}
.k-tot span{color:#C9CAE6;font-weight:600;font-size:14px}.k-tot b{font-size:34px;font-weight:800;letter-spacing:-.02em;text-align:right;white-space:nowrap}.k-tot i{font-style:normal;font-size:21px;color:var(--p-acc);margin-left:6px;filter:brightness(1.35)}
.k-empty{padding:120px 60px;text-align:center;color:var(--p-mut);font-size:16px;line-height:1.5}
.offscreen{position:fixed;left:-12000px;top:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="app">
  <aside class="side">
    <div>
      <h1>Смета в PDF</h1>
      <p class="lead">Загрузите Excel со сметой и скачайте оформленный PDF формата A4.</p>
    </div>
    <div class="panel">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Выбрать файл Excel">
        <b>Выберите .xlsx файл</b>
        <span>или перетащите сюда. Формулы и числа берутся из файла.</span>
      </div>
      <input id="file" type="file" accept=".xlsx,.xlsm,.xls" hidden>
      <div class="seg" role="group" aria-label="Тип документа"><button type="button" id="mSmeta" aria-pressed="true">Смета аренды</button><button type="button" id="mKp" aria-pressed="false">КП с фото</button></div>
      <div class="hint">Тип выбирается сам по файлу. Его можно переключить.</div>
      <div class="demo" id="demo">Сейчас показан пример. После загрузки здесь будет ваша смета.</div>
      <div class="status" id="status" role="status"></div>
    </div>
    <div class="panel">
      <label class="f" for="co">Название компании в шапке
        <input type="text" id="co" placeholder="Например, ТОО «Звук и Свет»" autocomplete="off">
      </label>
      <div class="f" style="gap:8px">Цвет акцента
        <div class="sw" id="sw"></div>
      </div>
      <div class="f" style="gap:8px">Логотип
        <div class="lrow"><button class="btn2" id="lbtn" type="button">Загрузить логотип</button><button class="btn2" id="lrm" type="button" hidden>Убрать</button></div>
        <img class="logo-prev" id="lprev" alt="Загруженный логотип" hidden>
        <input id="lfile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
      </div>
      <label class="chk" for="myl"><input type="checkbox" id="myl"> Логотип RentalHub</label>
      <label class="chk" for="pl" id="plw" hidden><input type="checkbox" id="pl"> Белая подложка под логотипом</label>
      <label class="chk" for="dt"><input type="checkbox" id="dt" checked> Показывать дату</label>
    </div>
    <button class="btn" id="go">Скачать PDF</button>
  </aside>
  <section class="preview"><div class="stage" id="stage"><div class="paper" id="paper"></div></div></section>
</div>
<div class="offscreen" id="off"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    var st=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true),d=u8.subarray(st,st+f.cs);
    return f.m===0?Promise.resolve(d.slice()):f.m===8?inflateRaw(d):Promise.resolve(null)}}}

function looksKp(grid,imgs){

function parseKp(grid,imgs,curDefault){
  var hr=-1;
  for(var i=0;i<grid.length;i++){var t=grid[i].cells.map(function(c){return typeof c.v==='string'?c.v.toLowerCase():''}).join('|');
    if(/(наимен|позиция|оборудование)/.test(t)&&/(цена|сумма|стоимость)/.test(t)){hr=i;break}}

    else if(cols.desc==null&&/(описан|характерист)/.test(l)){cols.desc=c.C}
    else if(cols.qty==null&&/(кол|шт)/.test(l)){cols.qty=c.C;cols.qtyLabel=s}
    else if(cols.price==null&&/(цена)/.test(l)){cols.price=c.C;cols.priceLabel=s}
    else if(cols.sum==null&&/(сумм|стоимост)/.test(l)){cols.sum=c.C;cols.sumLabel=s}
    else if(cols.extraC==null&&s){cols.extraC=c.C;cols.extra=s}});

  function num(v){return typeof v==='number'?v:null}
  function texts(r){return r.cells.filter(function(c){return typeof c.v==='string'&&c.v.trim()}).map(function(c){return c.v.trim()})}

  var cur='';
  grid.forEach(function(r){r.cells.forEach(function(c){var x=/\[\$([A-Za-z]{3})/.exec(c.z||'');if(x&&!cur)cur=x[1].toUpperCase()})});
  var CURM={KZT:'₸',USD:'$',EUR:'€',RUB:'₽'};m.cur=CURM[cur]||curDefault||'';

    if(!m.title){m.title=ts[0];continue}
    var mm=/^([^:]{1,40}):\s*(.*)$/.exec(ts[0]);
    if(mm){var v=(mm[2]||ts.slice(1).join(' ')).trim();if(v)m.meta.push({label:mm[1].trim(),value:v});continue}
    var s=ts.join(' ');m.pre.push(s.charAt(0).toUpperCase()+s.slice(1));
  }
  if(!m.title)m.title='Коммерческое предложение';
  var rowItem={},after=false;
  for(i=hr+1;i<grid.length;i++){
    var r=grid[i],ts2=texts(r),nums=r.cells.filter(function(c){return typeof c.v==='number'});
    if(!ts2.length&&!nums.length)continue;
    if(after){if(ts2.length)m.notes.push(ts2.join(' '));continue}
    if(nums.length&&ts2.some(function(t){return /(итог|всего)/i.test(t)})){

    var name=cols.name!=null?cell(r,cols.name):null;name=typeof name==='string'?name.trim():(name!=null?String(name):'');
    var q=cols.qty!=null?num(cell(r,cols.qty)):null,p=cols.price!=null?num(cell(r,cols.price)):null,su=cols.sum!=null?num(cell(r,cols.sum)):null;
    if(su==null&&q!=null&&p!=null)su=q*p;

  if(!m.total){var tot=0;m.items.forEach(function(it){if(it.sum)tot+=it.sum});m.total={label:'Итого',v:tot}}
  (imgs||[]).forEach(function(o,k){

      }else{var s=String(v).replace(/\r/g,'').trim();if(s)texts.push(s)}

  var cw=x1-x0+1,ch=y1-y0+1,c2=document.createElement('canvas');c2.width=cw;c2.height=ch;

  return Promise.all([deflate(rgb),sem?deflate(al):Promise.resolve(null)]).then(function(r){
    var fl=!!r[0];
    return {w:w,h:h,rgb:r[0]||rgb,alpha:sem?(r[1]||al):null,flate:fl&&(!sem||!!r[1])};
  });
}

  img.src=u;
});

function syncMy(){$('myl').checked=!!state.logo&&state.logo.my===true}
$('myl').addEventListener('change',function(e){
  if(e.target.checked){var img=new Image();img.onload=function(){applyLogo(trimLogo(img),'my').then(function(){state.logo.my=true;syncMy()})};img.src=MYLOGO}
  else clearLogo();
});
/* экспорт */
var downloads=null,btn=$('go');
function useDl(){
  if(!window.claude||!window.claude.use)return;
  window.claude.use('downloads').then(function(d){downloads=d}).catch(function(){});
}
useDl();
btn.addEventListener('click',function(){
  var isKp=state.mode==='kp',mdl=isKp?state.model:(state.model&&state.model.mode!=='kp'?state.model:SAMPLE);
  if(isKp&&!(mdl&&mdl.mode==='kp')){setStatus('Сначала загрузите Excel с коммерческим предложением.','err');return}
  if(isKp&&state.file&&state.file.imgs.length&&!state.kpDone){setStatus('Фото ещё обрабатываются. Нажмите ещё раз через секунду.','err');return}
  btn.disabled=true;btn.textContent='Готовлю PDF…';setStatus('');
  var bytes;
  try{bytes=buildPdf(mdl,{company:state.company.trim(),accent:state.accent,date:state.date,logo:state.logo&&state.logo.pdf,plaque:state.plaque,images:isKp?state.kpImages:[]},FONTS)}
  catch(e){setStatus('Не получилось собрать PDF. Проверьте файл и попробуйте ещё раз.','err');btn.disabled=false;btn.textContent='Скачать PDF';return}
  Promise.resolve().then(function(){
    var blob=new Blob([bytes],{type:'application/pdf'});
    if(downloads)return downloads.save({filename:state.fname+'.pdf',data:blob});
    var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=state.fname+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
  }).then(function(){setStatus('PDF сохранён.','ok')})
  .catch(function(e){
    var c=e&&e.code;
    setStatus(c==='declined'?'Сохранение отменено.':c==='unavailable'||c==='not_granted'?'Здесь нельзя сохранять файлы. Откройте страницу в приложении Claude.':'Не получилось сохранить PDF. Попробуйте ещё раз.','err');
  }).then(function(){btn.disabled=false;btn.textContent='Скачать PDF'});
});

state.model=SAMPLE;
paint();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
})();
